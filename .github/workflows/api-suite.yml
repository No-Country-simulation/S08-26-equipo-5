name: API Suite (server)

on:
  pull_request:
    paths:
      - "apps/server/**"
      - ".github/workflows/api-suite.yml"

concurrency:
  group: api-suite-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Vitest + suite .http (Swagger/Hoppscotch/REST Client)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: meetflow
          POSTGRES_PASSWORD: meetflow
          POSTGRES_DB: meetflow_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://meetflow:meetflow@localhost:5432/meetflow_ci
      JWT_SECRET: ci-test-secret-not-for-production
      NODE_ENV: test
      GETSTREAM_API_KEY: ${{ secrets.GETSTREAM_API_KEY }}
      GETSTREAM_API_SECRET: ${{ secrets.GETSTREAM_API_SECRET }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/server/package-lock.json

      - name: Install dependencies
        working-directory: apps/server
        run: npm ci

      - name: Typecheck
        working-directory: apps/server
        run: npx tsc --noEmit

      - name: Apply migrations
        working-directory: apps/server
        run: npx prisma migrate deploy

      - name: Run unit/integration tests (Vitest)
        working-directory: apps/server
        run: npm run test

      # La suite .http (api_auth.http, api_salas_agenda.http, api_waiting.http)
      # llama a GetStream de verdad (no está mockeado como en Vitest), por eso
      # necesita GETSTREAM_API_KEY/SECRET como secrets del repo. Si no están
      # configurados, este paso falla al crear una sala — ver docs/API.md.
      - name: Start server
        working-directory: apps/server
        run: npm run dev &

      - name: Wait for server
        run: npx wait-on http://localhost:4000/api/v1/health --timeout 30000

      - name: Run .http suite (httpyac)
        working-directory: apps/server
        run: npm run test:http
