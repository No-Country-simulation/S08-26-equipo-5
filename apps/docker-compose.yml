services:
  server:
    build:
      context: ./server
      target: dev
    image: meetflow-server:dev
    container_name: meetflow-server
    env_file:
      - ./server/.env
    environment:
      NODE_ENV: development
      PORT: 4000
    ports:
      - "4000:4000"
    volumes:
      - ./server:/app
      - /app/node_modules
    command: sh -c "npx prisma migrate deploy && npm run dev"
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:4000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - meetflow

  web:
    build:
      context: ./web
      target: dev
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
    image: meetflow-web:dev
    container_name: meetflow-web
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
    ports:
      - "3000:3000"
    volumes:
      - ./web:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      server:
        condition: service_healthy
    networks:
      - meetflow

networks:
  meetflow:
    driver: bridge
