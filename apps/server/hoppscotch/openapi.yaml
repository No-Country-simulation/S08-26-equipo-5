openapi: 3.0.3
info:
  title: MeetFlow API — Salas & Agenda
  description: >
    ⚠️ DEPRECADO — artefacto previo a la consolidación de Agenda (PR #74),
    puede contener endpoints que ya no existen. Fuente de verdad actual:
    src/docs/openapi.ts (servida en GET /api/v1/docs). Ver issue #33.
  version: 1.0.0

servers:
  - url: http://localhost:4000/api/v1
    description: Desarrollo local

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    Sala:
      type: object
      properties:
        id:
          type: string
          format: uuid
        codigo:
          type: string
          example: RGFG5365
        nombre:
          type: string
          example: Reunión Q4
        resumen:
          type: string
          nullable: true
        fechaInicio:
          type: string
          format: date-time
        estado:
          type: string
          enum: [PROGRAMADA, ACTIVA, FINALIZADA, CANCELADA]
        totalParticipantes:
          type: integer

    SalaDetalle:
      allOf:
        - $ref: '#/components/schemas/Sala'
        - type: object
          properties:
            fechaFin:
              type: string
              format: date-time
              nullable: true
            streamRoomId:
              type: string
              nullable: true
            enlace:
              type: string
            participantes:
              type: array
              items:
                $ref: '#/components/schemas/Participante'
            creador:
              $ref: '#/components/schemas/Creador'

    Participante:
      type: object
      properties:
        id:
          type: string
        nombre:
          type: string
        apellido:
          type: string
        email:
          type: string
        rol:
          type: string
          enum: [HOST, PARTICIPANTE]
        estado:
          type: string
        fechaIngreso:
          type: string
          format: date-time
          nullable: true

    Creador:
      type: object
      properties:
        id:
          type: string
        nombre:
          type: string
        apellido:
          type: string
        email:
          type: string

    CreateSalaBody:
      type: object
      required:
        - nombre
      properties:
        nombre:
          type: string
          maxLength: 150
        resumen:
          type: string
        fechaInicio:
          type: string
          format: date-time

    UpdateSalaBody:
      type: object
      properties:
        nombre:
          type: string
          maxLength: 150
        resumen:
          type: string
        fechaInicio:
          type: string
          format: date-time

    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string

paths:
  /salas:
    post:
      summary: Crear sala (auth requerido)
      tags: [Salas]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSalaBody'
      responses:
        '201':
          description: Sala creada
          content:
            application/json:
              schema:
                type: object
                properties:
                  salaId:
                    type: string
                  codigo:
                    type: string
                  nombre:
                    type: string
                  enlace:
                    type: string
                  streamRoomId:
                    type: string
        '401':
          description: No autenticado

  /salas/{code}:
    get:
      summary: Consulta pública por código
      tags: [Salas]
      parameters:
        - name: code
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Sala encontrada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sala'
        '404':
          description: Sala no encontrada

  /salas/mis-salas/list:
    get:
      summary: Salas donde soy HOST
      tags: [Agenda]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista de salas
          content:
            application/json:
              schema:
                type: object
                properties:
                  salas:
                    type: array
                    items:
                      $ref: '#/components/schemas/Sala'

  /salas/programadas/list:
    get:
      summary: Salas programadas/futuras
      tags: [Agenda]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Salas programadas
          content:
            application/json:
              schema:
                type: object
                properties:
                  salas:
                    type: array
                    items:
                      $ref: '#/components/schemas/Sala'

  /salas/{id}/detalle:
    get:
      summary: Detalle completo con participantes
      tags: [Salas]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Detalle de sala
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalaDetalle'
        '404':
          description: Sala no encontrada

  /salas/{id}:
    put:
      summary: Actualizar sala (solo HOST)
      tags: [Salas]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSalaBody'
      responses:
        '200':
          description: Sala actualizada
        '403':
          description: No es HOST
        '404':
          description: Sala no encontrada

    delete:
      summary: Cancelar sala (solo HOST)
      tags: [Salas]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Sala cancelada
        '403':
          description: No es HOST
        '404':
          description: Sala no encontrada

  /salas/{id}/participantes:
    get:
      summary: Lista de participantes
      tags: [Salas]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Lista de participantes
          content:
            application/json:
              schema:
                type: object
                properties:
                  salaId:
                    type: string
                  salaNombre:
                    type: string
                  total:
                    type: integer
                  participantes:
                    type: array
                    items:
                      $ref: '#/components/schemas/Participante'

  /rooms/{id}/token:
    post:
      summary: Generar token GetStream (Legacy)
      tags: [Legacy]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - userId
                - role
              properties:
                userId:
                  type: string
                role:
                  type: string
                  enum: [HOST, PARTICIPANTE]
      responses:
        '200':
          description: Token generado
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string

tags:
  - name: Salas
    description: CRUD de salas
  - name: Agenda
    description: Endpoints para la agenda del frontend
  - name: Legacy
    description: Endpoints antiguos
